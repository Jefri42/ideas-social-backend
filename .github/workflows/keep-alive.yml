# ============================================================
# KEEP-ALIVE — evita que Supabase pause el proyecto
# ============================================================
# Los proyectos gratuitos de Supabase se pausan tras ~7 dias sin
# actividad. Cuando eso pasa el backend entero se cae y el deploy de
# Render falla en "migrate" con:
#
#   FATAL: (ENOTFOUND) tenant/user postgres.<ref> not found
#
# Este workflow pega cada 3 dias a un endpoint que hace una consulta
# real a la base de datos, de modo que Supabase la cuenta como
# actividad y no la pausa.
#
# (Esto NO mantiene caliente el servicio de Render: el plan gratuito
# se duerme a los ~15 minutos de inactividad, asi que un ping cada 3
# dias solo lo despierta un momento. Por eso el primer intento puede
# tardar medio minuto.)
#
# El segundo trabajo resuelve el otro lado del problema: GitHub
# desactiva los workflows programados si el repositorio pasa 60 dias
# sin actividad, y entonces esto dejaria de ejecutarse en silencio.
# Empujar un commit a la rama "keepalive" en cada ejecucion reinicia
# ese contador.
# ============================================================
name: Keep alive

on:
  schedule:
    # Cada 3 dias a las 12:00 UTC. Supabase pausa a los ~7 dias, asi
    # que este margen aguanta incluso si falla una ejecucion.
    - cron: '0 12 */3 * *'
  # Permite lanzarlo a mano desde la pestana Actions
  workflow_dispatch:

# Necesario para poder empujar a la rama "keepalive".
permissions:
  contents: write

# Dos ejecuciones a la vez se pisarian al hacer push.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la API (toca la base de datos)
        run: |
          URL="https://ideas-social-backend.onrender.com/api/ideas/"

          # Render duerme el servicio gratuito: el primer intento puede
          # tardar bastante en despertarlo, por eso reintentamos.
          for intento in 1 2 3 4 5; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$URL" || echo "000")
            echo "Intento $intento -> HTTP $codigo"

            if [ "$codigo" = "200" ]; then
              echo "Backend y base de datos responden correctamente."
              exit 0
            fi

            sleep 30
          done

          echo "::error::El backend no respondio 200 tras 5 intentos (ultimo: $codigo)."
          echo "Revisa si el proyecto de Supabase esta pausado."
          exit 1

      # Los dos pasos siguientes llevan "if: always()" a proposito: si el
      # ping falla queremos que el workflow salga en rojo, pero AUN ASI
      # hay que registrar actividad, o GitHub acabara desactivandolo.
      - name: Descargar la rama keepalive
        if: always()
        uses: actions/checkout@v5
        with:
          ref: keepalive
          fetch-depth: 1

      - name: Registrar actividad en el repositorio
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ahora=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          if grep -q '^last-ping:' last-ping.txt; then
            sed -i "s|^last-ping: .*|last-ping: $ahora|" last-ping.txt
          else
            printf '\nlast-ping: %s\n' "$ahora" >> last-ping.txt
          fi

          git add last-ping.txt
          git commit -m "Keep alive: $ahora"

          # Si otra ejecucion empujo primero, reintegramos y reintentamos.
          git push origin keepalive || {
            git pull --rebase origin keepalive
            git push origin keepalive
          }
